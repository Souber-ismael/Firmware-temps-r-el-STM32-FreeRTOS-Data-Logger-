name: CI

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests_SASE/test_projet
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Ceedling and gcovr
        run: |
          gem install ceedling -v 1.1.10
          pip install gcovr==8.6

      - name: Show versions
        run: |
          ceedling version
          gcc --version
          gcovr --version

      - name: Unit tests
        run: ceedling test:all

      - name: Coverage
        run: ceedling gcov:all


      - name: Examiner les résultats gcov
        if: always()
        working-directory: tests_SASE/test_projet
        run: |
          echo "=== Fichiers produits par gcov ==="
          find build/gcov -type f -print
          echo "=== Configuration de couverture ==="
          grep -n -A 12 -B 3 -E 'gcov|gcovr|coverage' project.yml || true
        