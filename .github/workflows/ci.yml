
name: STM32 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: tests_SASE/test_projet

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Installer Ceedling, GCC et gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-pip
          gem install ceedling -v 1.1.10
          pip install --user --break-system-packages gcovr==8.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verifier les versions
        run: |
          ceedling version
          gcc --version
          gcov --version
          gcovr --version

      - name: Executer les tests unitaires
        run: ceedling test:all

      - name: Generer les donnees de couverture
        if: always()
        run: ceedling gcov:all

    
      - name: Generer le rapport HTML
        if: always()
        run: |
          mkdir -p build/artifacts/gcov/gcovr
          gcovr --root ../.. \
                --gcov-ignore-errors=no_working_dir_found \
                --filter '.*/(Driver|APP)/.*' \
                --exclude '.*/build/.*' \
                --merge-mode-functions=separate \
                --html-nested build/artifacts/gcov/gcovr/index.html \
                --html-title "STM32 Data Logger - Couverture" \
                --html-theme github.dark-green \
                --txt build/artifacts/gcov/gcovr/coverage.txt \
                --print-summary \
                build/gcov/out
        
      - name: Test gcov direct
        if: always()
        run: |
          gcov -b build/gcov/out/test_storage/storage.gcda || true
          ls *.gcov 2>/dev/null | head

      - name: Lister les rapports generes
        if: always()
        run: |
          echo "=== Rapports disponibles ==="
          find build/artifacts/gcov -type f -print || true

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture
          path: tests_SASE/test_projet/build/artifacts/gcov/gcovr/
          if-no-files-found: warn
