name: CI

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests_SASE/test_projet
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Installer Ceedling et gcovr
        run: |
          gem install ceedling -v 1.1.10
          pip install gcovr==8.6

      - name: Verifier les versions
        run: |
          ceedling version
          gcc --version
          gcov --version
          gcovr --version

      - name: Executer les tests unitaires
        run: ceedling test:all

      - name: Generer les donnees de couverture
        if: always()
        run: ceedling gcov:all

      - name: Generer le rapport HTML
        if: always()
        run: |
          mkdir -p build/artifacts/gcov/gcovr
          gcovr --root ../.. \
                --gcov-ignore-errors=no_working_dir_found \
                --filter '.*/(Driver|APP)/.*' \
                --exclude '.*/build/.*' \
                --merge-mode-functions=separate \
                --fail-under-line 80 \
                --html-nested build/artifacts/gcov/gcovr/index.html \
                --html-title "STM32 Data Logger - Couverture" \
                --txt build/artifacts/gcov/gcovr/coverage.txt \
                --print-summary \
                build/gcov/out

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture
          path: tests_SASE/test_projet/build/artifacts/gcov/gcovr/
          if-no-files-found: warn