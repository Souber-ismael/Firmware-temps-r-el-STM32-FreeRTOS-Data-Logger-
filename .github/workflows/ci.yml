name: CI

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests_SASE/test_projet
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Ceedling and gcovr
        run: |
          gem install ceedling -v 1.1.10
          pip install gcovr==8.6

      - name: Show versions
        run: |
          ceedling version
          gcc --version
          gcovr --version

      - name: Unit tests
        run: ceedling test:all

      - name: Coverage
        run: ceedling gcov:all


      - name: Where is the report?
        if: always()
        working-directory: tests_SASE/test_projet
        run: |
          echo "--- build/artifacts ---"
          ls -R build/artifacts 2>&1 | head -40
          echo "--- html files ---"
          find . -name "*.html" -not -path "./build/vendor/*" | head -20
          echo "--- gcda files ---"
          find . -name "*.gcda" | head -5
        