name: CI

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests_SASE/test_projet
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Ceedling and gcovr
        run: |
          gem install ceedling -v 1.1.10
          pip install gcovr==8.6

      - name: Show versions
        run: |
          ceedling version
          gcc --version
          gcovr --version

      - name: Unit tests
        run: ceedling test:all

      - name: Coverage
        run: ceedling gcov:all

      - name: Diagnostiquer les fichiers de couverture
        if: always()
        working-directory: tests_SASE/test_projet
        run: |
          echo "=== Répertoire courant ==="
          pwd
          echo "=== Fichiers coverage ==="
          find . -type f \( -iname '*coverage*' -o -iname '*gcov*' -o -iname '*.info' \)
          echo "=== Répertoires de build ==="
          find build -maxdepth 5 -type d 2>/dev/null || true
        